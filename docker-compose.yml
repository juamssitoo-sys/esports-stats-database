services:
  postgres:
    image: postgres:16
    container_name: esports-stats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: esports_stats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "5432:5432"
    volumes:
      - esports_stats_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esports_stats"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  esports_stats_pgdata:
