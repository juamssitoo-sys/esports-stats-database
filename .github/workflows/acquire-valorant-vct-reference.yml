name: Acquire VALORANT historical dataset
on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * 1"
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download public VCT Reference database
        run: |
          set -euo pipefail
          mkdir -p data/raw/valorant/vct-reference
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 \
            https://vct-reference.com/dataset/vct.duckdb \
            --output data/raw/valorant/vct-reference/vct.duckdb
          test "$(stat -c%s data/raw/valorant/vct-reference/vct.duckdb)" -gt 1000000
      - name: Inspect source schema and coverage
        run: |
          pip install duckdb
          python - <<'PY'
          import duckdb, json, os
          path='data/raw/valorant/vct-reference/vct.duckdb'
          con=duckdb.connect(path, read_only=True)
          tables=con.execute("SHOW TABLES").fetchall()
          report={"source":"VCT Reference","source_url":"https://vct-reference.com/dataset","terms_url":"https://vct-reference.com/terms","downloaded_bytes":os.path.getsize(path),"tables":[]}
          for (table,) in tables:
              schema=con.execute(f"DESCRIBE SELECT * FROM \"{table}\"").fetchall()
              count=con.execute(f"SELECT COUNT(*) FROM \"{table}\"").fetchone()[0]
              report["tables"].append({"name":table,"rows":count,"columns":[{"name":r[0],"type":r[1]} for r in schema]})
              print(f"{table}: {count:,} rows; columns: "+", ".join(r[0] for r in schema))
          with open('data/raw/valorant/vct-reference/source_schema.json','w') as f: json.dump(report,f,indent=2)
          con.close()
          assert any(t["name"]=="matches" for t in report["tables"])
          assert any(t["name"]=="player_map" for t in report["tables"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: valorant-vct-reference-source
          path: data/raw/valorant/vct-reference/
          retention-days: 90
