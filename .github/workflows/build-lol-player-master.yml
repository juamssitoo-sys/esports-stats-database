name: Build LoL player master
on:
  push:
    paths:
      - 'scripts/build_lol_player_master.py'
      - '.github/workflows/build-lol-player-master.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download validated ChainCC source artifact
        uses: actions/download-artifact@v4
        with:
          name: chaincc-lol-2025-2026
          repository: juamssitoo-sys/esports-stats-database
          run-id: 44026633208
          github-token: ${{ github.token }}
          path: data/incoming
      - name: Build player master
        run: python scripts/build_lol_player_master.py --input-dir data/incoming/curated/lol/chaincc
      - name: Validate output
        run: |
          python - <<'PY'
          import csv, json
          p='data/curated/lol/chaincc/players_master_2025_2026.csv'
          with open(p, newline='', encoding='utf-8') as f: rows=list(csv.DictReader(f))
          assert len(rows)>1000, f'Unexpected player count: {len(rows)}'
          assert all(r['player_id'] and r['identity_status']=='PROVISIONAL_HANDLE_ONLY' for r in rows)
          m=json.load(open('data/curated/lol/chaincc/players_master_manifest.json'))
          assert m['unique_source_handle_keys']==len(rows)
          print(f"Validated {len(rows)} provisional LoL player identities")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lol-player-master-2025-2026
          path: data/curated/lol/chaincc/
          retention-days: 90
